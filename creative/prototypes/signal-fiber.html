<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal to Fiber Prototype</title>
  <style>
    :root { color-scheme: dark; --red: #ea2027; --carbon: #080a0c; --steel: #899099; }
    * { box-sizing: border-box; }
    html { background: var(--carbon); }
    body { margin: 0; min-height: 320vh; color: #f3f1ec; font-family: ui-sans-serif, system-ui, sans-serif; overflow-x: hidden; }
    .stage { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 40%, #161b20, var(--carbon) 60%); }
    .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .1; background-image: linear-gradient(rgba(255,255,255,.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.1) 1px, transparent 1px); background-size: 80px 80px; mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); }
    svg { width: min(90vw, 1100px); height: min(60vh, 620px); overflow: visible; position: relative; z-index: 1; }
    .route { fill: none; stroke: var(--red); stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 12px rgba(234,32,39,.8)); stroke-dasharray: 1; stroke-dashoffset: calc(1 - var(--progress)); }
    .ghost { fill: none; stroke: rgba(255,255,255,.14); stroke-width: 1; }
    .copy { position: fixed; left: clamp(20px, 8vw, 120px); top: 50%; z-index: 2; transform: translateY(-50%); max-width: 460px; }
    .eyebrow { color: var(--steel); font: 11px ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; }
    h1 { font-size: clamp(42px, 8vw, 100px); line-height: .86; letter-spacing: -.07em; margin: 18px 0; }
    p { color: #aeb3ba; line-height: 1.6; }
    .phase { color: var(--red); font: 12px ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
    @media (prefers-reduced-motion: reduce) { body { min-height: 100vh; } .stage { position: relative; min-height: 100vh; } .route { stroke-dashoffset: 0; } }
  </style>
</head>
<body>
  <main class="stage" aria-label="Signal to fiber motion prototype">
    <svg viewBox="0 0 1000 520" role="img" aria-label="A red route changing into a fiber beam">
      <path class="ghost" d="M40 360 C220 160 320 440 470 290 S700 130 960 70" pathLength="1" />
      <path class="route" d="M40 360 C220 160 320 440 470 290 S700 130 960 70" pathLength="1" />
    </svg>
    <div class="copy">
      <div class="eyebrow">isolated motion proof / 01</div>
      <h1>Signal<br />becomes<br />fiber.</h1>
      <div class="phase" id="phase">RF SIGNAL</div>
      <p>Scroll slowly. The same line advances from a transmission pulse to a route, then resolves as a light path through glass.</p>
    </div>
  </main>
  <script>
    const root = document.documentElement;
    const phase = document.querySelector('#phase');
    const phases = ['RF SIGNAL', 'ROUTE', 'FIBER BEAM'];
    const update = () => {
      const max = document.documentElement.scrollHeight - innerHeight;
      const progress = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
      root.style.setProperty('--progress', progress.toFixed(3));
      phase.textContent = phases[Math.min(2, Math.floor(progress * 3))];
    };
    addEventListener('scroll', update, { passive: true });
    addEventListener('resize', update);
    update();
  </script>
</body>
</html>
